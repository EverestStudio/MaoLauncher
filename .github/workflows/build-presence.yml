name: Build MaoPresence

on:
  push:
    branches: [main]
    paths: ["MaoPresence/**", ".github/workflows/build-presence.yml"]
  pull_request:
    paths: ["MaoPresence/**", ".github/workflows/build-presence.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Build Fabric mod and Paper plugin
        run: gradle :fabric:build :paper:build
        working-directory: MaoPresence
      - uses: actions/upload-artifact@v4
        with:
          name: mao-presence-26.2
          path: |
            MaoPresence/fabric/build/libs/mao-presence-fabric-*.jar
            MaoPresence/paper/build/libs/paper-*.jar
