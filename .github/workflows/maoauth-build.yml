name: MaoAuth build
on:
  push:
    paths:
      - "MaoAuth/**"
      - ".github/workflows/maoauth-build.yml"
  pull_request:
    paths:
      - "MaoAuth/**"
      - ".github/workflows/maoauth-build.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build plugin
        run: mvn -B -f MaoAuth/pom.xml clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MaoAuth-0.1.0
          path: MaoAuth/target/maoauth-0.1.0.jar
