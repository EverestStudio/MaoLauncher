name: Build and publish MaoLauncher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Номер новой версии (например, 2.0.0 или v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and prepare release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $inputVersion = $env:INPUT_VERSION.Trim()
          $version = $inputVersion.TrimStart('v', 'V')
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+$') {
            throw "Version must use semantic format X.Y.Z, for example 2.0.0."
          }
          $tag = "v$version"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Choose a new version."
          }

          $latestJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestJson) {
            $latest = ($latestJson | ConvertFrom-Json).tag_name.TrimStart('v', 'V')
            if ($latest -match '^\\d+\\.\\d+\\.\\d+$' -and [version]$version -le [version]$latest) {
              throw "Version $version must be greater than the latest published version $latest."
            }
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MaoLauncherNew/package-lock.json

      - name: Set launcher version
        shell: pwsh
        run: npm version "$env:RELEASE_VERSION" --no-git-tag-version --prefix MaoLauncherNew

      - name: Install launcher dependencies
        working-directory: MaoLauncherNew
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: MaoLauncherNew
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check game.cjs
          node --check ping.cjs
          node --check mods.cjs
          node --check addons.cjs

      - name: Build Windows x64 launcher
        working-directory: MaoLauncherNew
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package launcher and calculate SHA-256
        shell: pwsh
        working-directory: MaoLauncherNew
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archiveName = "MaoLauncher-$version-win-x64.zip"
          $archivePath = "dist/$archiveName"
          if (!(Test-Path "dist/win-unpacked/MaoLauncher.exe")) {
            throw "MaoLauncher.exe was not produced by electron-builder."
          }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $archivePath -Force
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path "$archivePath.sha256" -NoNewline
          "LAUNCHER_ARCHIVE=$((Resolve-Path $archivePath).Path)" >> $env:GITHUB_ENV
          "LAUNCHER_CHECKSUM=$((Resolve-Path "$archivePath.sha256").Path)" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MaoLauncher Setup
        shell: pwsh
        run: |
          dotnet publish MaoLauncher-Setup/MaoLauncher.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/setup
          if (!(Test-Path "artifacts/setup/MaoLauncher-Setup.exe")) {
            throw "MaoLauncher-Setup.exe was not produced."
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "$env:LAUNCHER_ARCHIVE" "$env:LAUNCHER_CHECKSUM" "artifacts/setup/MaoLauncher-Setup.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MaoLauncher $env:RELEASE_TAG" --notes "Automated Windows x64 release of MaoLauncher and its auto-updating installer." --latest
