name: Build and publish MaoLauncher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set launcher version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must look like v2.0.0."
          }
          npm version $version --no-git-tag-version --prefix MaoLauncherNew

      - name: Install launcher dependencies
        working-directory: MaoLauncherNew
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: MaoLauncherNew
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check game.cjs
          node --check ping.cjs
          node --check mods.cjs

      - name: Build Windows x64 launcher
        working-directory: MaoLauncherNew
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package portable launcher and calculate checksum
        shell: pwsh
        working-directory: MaoLauncherNew
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archiveName = "MaoLauncher-$version-win-x64.zip"
          $archivePath = "dist/$archiveName"
          if (!(Test-Path "dist/win-unpacked/MaoLauncher.exe")) {
            throw "MaoLauncher.exe was not produced by electron-builder."
          }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $archivePath -Force
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path "$archivePath.sha256" -NoNewline
          "LAUNCHER_ARCHIVE=$((Resolve-Path $archivePath).Path)" >> $env:GITHUB_ENV
          "LAUNCHER_CHECKSUM=$((Resolve-Path "$archivePath.sha256").Path)" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MaoLauncher Setup
        shell: pwsh
        run: |
          dotnet publish MaoLauncher-Setup/MaoLauncher.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/setup
          if (!(Test-Path "artifacts/setup/MaoLauncher-Setup.exe")) {
            throw "MaoLauncher-Setup.exe was not produced."
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Use a new version tag; existing releases are never overwritten."
          }
          gh release create $tag "$env:LAUNCHER_ARCHIVE" "$env:LAUNCHER_CHECKSUM" "artifacts/setup/MaoLauncher-Setup.exe" --repo $env:GITHUB_REPOSITORY --title "MaoLauncher $tag" --notes "Automated Windows x64 release of MaoLauncher and its auto-updating installer." --latest
