name: Build MaoLauncher (Windows)

on:
  pull_request:
    branches: [main]
    paths:
      - "MaoLauncherNew/**"
      - ".github/workflows/build-launcher.yml"
  push:
    branches: [main]
    paths:
      - "MaoLauncherNew/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MaoLauncherNew/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: MaoLauncherNew

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check game.cjs
          node --check ping.cjs
          node --check mods.cjs
        working-directory: MaoLauncherNew

      - name: Build Windows launcher
        run: npm run build:win
        working-directory: MaoLauncherNew
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaoLauncher-windows
          path: MaoLauncherNew/dist/**
          if-no-files-found: error
          retention-days: 14
