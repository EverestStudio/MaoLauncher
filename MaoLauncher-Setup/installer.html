<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaoLauncher Setup</title>
<style>
:root{color-scheme:dark;--bg:#090a0e;--panel:#12141a;--line:rgba(255,255,255,.09);--muted:#8f94a1;--text:#f4f5f7;--accent:#ff9d45;--accent2:#ffd18e}
*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:100%;margin:0}
body{display:grid;place-items:stretch;padding:0;overflow:hidden;background:transparent;color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.window{width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(28,30,38,.98),rgba(11,12,16,.98));box-shadow:0 30px 100px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.025) inset}
.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);user-select:none}
.caption{display:flex;align-items:center;gap:9px;color:#d4d6dc;font-size:12px;letter-spacing:.02em;cursor:move}
.caption-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(255,157,69,.75)}
.window-actions{display:flex;gap:7px}.window-actions button{width:28px;height:26px;padding:0;border:0;border-radius:6px;color:#aeb2bd;background:transparent;cursor:pointer;font-size:16px}.window-actions button:hover{color:#fff;background:rgba(255,255,255,.1)}.window-actions .close:hover{color:#fff;background:#c44545}
main{height:462px;display:flex;flex-direction:column;align-items:center;padding:30px 48px 28px}
.logo-wrap{position:relative;width:clamp(150px,31vw,190px);aspect-ratio:1;overflow:hidden;filter:drop-shadow(0 18px 24px rgba(0,0,0,.4))}
.logo-wrap img{display:block;width:100%;height:100%;object-fit:contain}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 44%,rgba(255,255,255,.82) 50%,rgba(255,255,255,.08) 56%,transparent 65%);background-size:250% 100%;background-position:150% 0;background-repeat:no-repeat;-webkit-mask-image:url("kitty.png");mask-image:url("kitty.png");-webkit-mask-mode:alpha;mask-mode:alpha;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,8%{background-position:150% 0}88%,100%{background-position:-50% 0}}
h1{margin:8px 0 1px;font-size:42px;line-height:1;letter-spacing:.01em;font-weight:750}
.tagline{margin:10px 0 0;color:var(--accent2);font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.progress-area{width:min(470px,100%);margin-top:auto}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;color:#d7d9df;font-size:12px}
#status{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#percent{color:var(--accent2);font-variant-numeric:tabular-nums}
.track{height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ec7133,var(--accent),#ffd48f);box-shadow:0 0 15px rgba(255,157,69,.55);transition:width .25s ease}
.details{display:flex;justify-content:space-between;margin-top:10px;color:#6f7480;font-size:11px}
@media(prefers-reduced-motion:reduce){.shine{animation-duration:8s}.bar{transition:none}}
</style></head>
<body><section class="window" id="window" aria-label="Установщик MaoLauncher">
<header class="titlebar" id="titlebar"><div class="caption" id="drag"><span class="caption-dot"></span><span>MaoLauncher Setup</span></div>
<div class="window-actions"><button type="button" id="minimize" aria-label="Свернуть" title="Свернуть">−</button><button type="button" class="close" id="close" aria-label="Закрыть" title="Закрыть">×</button></div></header>
<main><div class="logo-wrap"><img src="kitty.png" alt="Логотип MaoLauncher"><div class="shine"></div></div>
<h1>MaoLauncher</h1><p class="tagline">MaoPickMe</p>
<div class="progress-area"><div class="status-row"><span id="status">Подготовка файлов...</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Прогресс установки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div>
<div class="details"><span id="detail">Инициализация установщика</span><span>v1.0.0</span></div></div></main></section>
<script>
const bar=document.getElementById('bar'),percent=document.getElementById('percent'),status=document.getElementById('status'),detail=document.getElementById('detail'),progress=document.querySelector('[role="progressbar"]');
window.setProgress=(value,text)=>{const v=Math.max(0,Math.min(100,Number(value)||0));bar.style.width=v+'%';percent.textContent=v+'%';progress.setAttribute('aria-valuenow',String(v));if(text)detail.textContent=text;};
window.setStatus=(text,subtext)=>{status.textContent=text||'';if(subtext)detail.textContent=subtext;};
const send=action=>window.chrome?.webview?.postMessage({action});
document.getElementById('minimize').addEventListener('click',()=>send('minimize'));
document.getElementById('close').addEventListener('click',()=>send('close'));
document.getElementById('drag').addEventListener('mousedown',e=>{if(e.button===0)send('drag');});
</script></body></html>
