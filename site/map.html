<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaoPickMe — Приватный ванильный сервер</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#a855f7;--accent-dim:#9333ea;--accent-glow:rgba(168,85,247,.3);--card-bg:var(--card);--card-border:var(--border);--text-primary:var(--text);--text-secondary:var(--muted);--bg-secondary:var(--bg2)}
[data-theme="dark"]{--bg:#0f0f0f;--bg2:#161618;--card:#1a1a1a;--text:#e5e5e5;--muted:#888;--border:#2a2a2a;--input-bg:#141414;--nav-bg:rgba(15,15,15,.92);--snow-color:rgba(255,255,255,.6)}
[data-theme="light"]{--bg:#f5f3ff;--bg2:#ede9fe;--card:#ffffff;--text:#1a1a2e;--muted:#6b7280;--border:#d4d4d8;--input-bg:#f9fafb;--nav-bg:rgba(245,243,255,.92);--snow-color:rgba(168,85,247,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit;transition:color .2s}

/* SNOWFLAKES */
.snowflake-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.snowflake-container::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.05),transparent 60%);pointer-events:none}
.snowflake{position:absolute;top:-12px;color:var(--snow-color);font-size:1rem;animation:snowfall linear infinite;opacity:0;will-change:transform;text-shadow:0 0 6px rgba(255,255,255,.35);user-select:none}
.snowflake.near{filter:blur(0);opacity:.95}
.snowflake.mid{filter:blur(.6px);opacity:.7}
.snowflake.far{filter:blur(1.4px);opacity:.45}
@keyframes snowfall{0%{transform:translateY(-12px) translateX(0) rotate(0deg);opacity:0}8%{opacity:var(--op,.9)}92%{opacity:var(--op,.9)}100%{transform:translateY(105vh) translateX(var(--drift)) rotate(360deg);opacity:0}}
@keyframes snowfall-gust{0%{transform:translateY(-12px) translateX(0) rotate(0deg);opacity:0}8%{opacity:var(--op,.9)}92%{opacity:var(--op,.9)}100%{transform:translateY(105vh) translateX(calc(var(--drift) * 2.2)) rotate(420deg);opacity:0}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;transition:background .3s,border-color .3s}
.nav-logo{display:flex;align-items:center}
.nav-logo img{width:38px;height:38px;object-fit:contain;display:block}
.nav-links{display:flex;gap:1.5rem;font-size:.9rem}
.nav-links a{color:var(--muted);font-weight:600}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:border-color .2s,background .2s;color:var(--text)}
.theme-toggle:hover{border-color:var(--accent);background:rgba(168,85,247,.08)}
.nav-cta{background:var(--accent);color:#fff;padding:.5rem 1.2rem;border-radius:8px;font-weight:700;font-size:.85rem;transition:transform .15s,box-shadow .15s}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.burger{display:none;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}

/* MAIN CONTENT */
main{position:relative;z-index:1}

/* FOOTER */
footer{text-align:center;padding:3rem 2rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);position:relative;z-index:1;transition:border-color .3s}

/* COMMON COMPONENTS */
.btn{display:inline-block;padding:.85rem 2rem;border-radius:10px;font-weight:700;font-size:1rem;transition:all .2s;cursor:pointer;border:none;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{box-shadow:0 4px 24px var(--accent-glow);transform:translateY(-2px)}
.btn-outline{border:2px solid var(--border);color:var(--text);background:transparent}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.section-title{font-size:2rem;font-weight:800;margin-bottom:2rem;display:flex;align-items:center;gap:.75rem}
.section-title::before{content:'';width:4px;height:2rem;background:var(--accent);border-radius:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;transition:border-color .2s,background .3s}
.card:hover{border-color:var(--accent)}

@media(max-width:768px){
  nav .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--nav-bg);flex-direction:column;padding:1rem 2rem;gap:.75rem;border-bottom:1px solid var(--border)}
  nav .nav-links.open{display:flex}
  .burger{display:block}
  .nav-cta{display:none}
}

/* MAP EMBED */
.map-embed-wrap{max-width:1200px;margin:0 auto}
.map-embed-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.map-embed{position:relative;width:100%;aspect-ratio:16/9;min-height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--card);box-shadow:0 10px 32px rgba(0,0,0,.25)}
.map-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s}
.map-embed.loaded iframe{opacity:1}
.map-embed-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted);transition:opacity .4s}
.map-embed.loaded .map-embed-loading{opacity:0;pointer-events:none}
.map-spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.map-embed{aspect-ratio:4/3;min-height:320px}}

</style>
<style>.account-link{color:var(--text);font-weight:700;font-size:.88rem;padding:.48rem .85rem;border:1px solid var(--border);border-radius:8px;white-space:nowrap}.account-link:hover{color:var(--accent);border-color:var(--accent)}@media(max-width:700px){.account-link{font-size:.8rem;padding:.4rem .6rem}}</style>
</head>

<script>
const observer=new IntersectionObserver(e=>{e.forEach(i=>{if(i.isIntersecting)i.target.classList.add('visible')})},{threshold:.1});
document.querySelectorAll('.fade-in').forEach(el=>observer.observe(el));

// IP copy
document.getElementById('ipCopyBox').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText('mc.maopickme.ru');
    const icon = document.querySelector('#ipCopyBox .copy-icon');
    icon.textContent = '✓';
    setTimeout(()=>icon.textContent='📋', 1200);
  } catch(e){}
});

// Online + player avatars
const tooltip = document.createElement('div');
tooltip.className = 'player-tooltip';
document.body.appendChild(tooltip);

async function fetchOnline(){
  try{
    const res = await fetch('https://api.mcstatus.io/v2/status/java/mc.maopickme.ru');
    const data = await res.json();
    const row = document.getElementById('playersRow');
    if(data.online){
      document.getElementById('onlineCount').textContent = data.players.online;
      row.innerHTML = '';
      const list = data.players.list || [];
      const MAX = 5;
      list.slice(0,MAX).forEach(p=>{
        const name = p.name_clean || p.name;
        const div = document.createElement('div');
        div.className = 'player-skin';
        div.innerHTML = `<img src="https://mc-heads.net/avatar/${encodeURIComponent(name)}/64" alt="${name}">`;
        div.addEventListener('mousemove',e=>{
          tooltip.textContent = name;
          tooltip.classList.add('show');
          tooltip.style.left = (e.clientX+12)+'px';
          tooltip.style.top = (e.clientY+12)+'px';
        });
        div.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));
        row.appendChild(div);
      });
      const rest = Math.max(0, (data.players.online||0) - Math.min(list.length, MAX));
      if(rest > 0){
        const more = document.createElement('span');
        more.className = 'more-online';
        more.textContent = '+' + rest;
        row.appendChild(more);
      }
    } else {
      document.getElementById('onlineCount').textContent = '0';
      row.innerHTML = '';
    }
  } catch(e){
    document.getElementById('onlineCount').textContent = '—';
  }
}
fetchOnline();
setInterval(fetchOnline, 60000);

// Map embed loader
(function(){
  const wrap = document.getElementById('mapEmbed');
  const frame = document.getElementById('mapFrame');
  if(!wrap || !frame) return;
  let done = false;
  const mark = () => { if(done) return; done = true; wrap.classList.add('loaded'); };
  frame.addEventListener('load', mark);
  setTimeout(mark, 12000);
})();

</script>

<script>
// Theme toggle
const html = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const saved = localStorage.getItem('theme') || 'dark';
html.setAttribute('data-theme', saved);
themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';

themeBtn.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

// Mobile menu
document.getElementById('burgerBtn').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

// Snowflakes
const snowContainer = document.getElementById('snowContainer');
const symbols = ['❄','❅','❆','❄','✦','✧','❄','•'];
const rand = (a,b) => a + Math.random() * (b - a);
function createSnowflake() {
  const el = document.createElement('span');
  // depth layer: far = small/blurry/slow, near = big/sharp/fast
  const roll = Math.random();
  let layer, size, dur, op;
  if (roll < 0.45) { layer = 'far'; size = rand(0.35, 0.7); dur = rand(16, 26); op = rand(0.25, 0.45); }
  else if (roll < 0.8) { layer = 'mid'; size = rand(0.7, 1.2); dur = rand(10, 18); op = rand(0.5, 0.75); }
  else { layer = 'near'; size = rand(1.2, 2.1); dur = rand(6, 12); op = rand(0.8, 1); }
  el.className = 'snowflake ' + layer;
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = rand(-2, 100) + '%';
  el.style.fontSize = size + 'rem';
  el.style.setProperty('--drift', rand(-70, 70) + 'px');
  el.style.setProperty('--op', op);
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = rand(-20, 0) + 's';
  if (Math.random() < 0.18) {
    el.style.animationName = 'snowfall-gust';
    el.style.animationDuration = dur * 0.7 + 's';
  }
  snowContainer.appendChild(el);
  setTimeout(() => el.remove(), (dur + 25) * 1000);
}
// Initial batch — dense snow
for (let i = 0; i < 80; i++) createSnowflake();
// Continuous snowfall
setInterval(createSnowflake, 180);
// Gust waves
setInterval(() => {
  const all = snowContainer.querySelectorAll('.snowflake');
  all.forEach(el => {
    if (Math.random() < 0.12) {
      el.style.setProperty('--drift', rand(-120, 120) + 'px');
    }
  });
}, 2500);

// Active link highlight
const path = window.location.pathname;
document.querySelectorAll('.nav-links a').forEach(a => {
  a.classList.remove('active');
  if (a.getAttribute('href') === path) a.classList.add('active');
});
</script>
</body>
</html>
