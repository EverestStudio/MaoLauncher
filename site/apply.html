<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">

<style>
:root{--accent:#a855f7;--accent-dim:#9333ea;--accent-glow:rgba(168,85,247,.3);--card-bg:var(--card);--card-border:var(--border);--text-primary:var(--text);--text-secondary:var(--muted);--bg-secondary:var(--bg2)}
[data-theme="dark"]{--bg:#0f0f0f;--bg2:#161618;--card:#1a1a1a;--text:#e5e5e5;--muted:#888;--border:#2a2a2a;--input-bg:#141414;--nav-bg:rgba(15,15,15,.92);--snow-color:rgba(255,255,255,.6)}
[data-theme="light"]{--bg:#f5f3ff;--bg2:#ede9fe;--card:#ffffff;--text:#1a1a2e;--muted:#6b7280;--border:#d4d4d8;--input-bg:#f9fafb;--nav-bg:rgba(245,243,255,.92);--snow-color:rgba(168,85,247,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{min-height:100%;display:flex;flex-direction:column}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit;transition:color .2s}

/* SNOWFLAKES */
.snowflake-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.snowflake-container::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.05),transparent 60%);pointer-events:none}
.snowflake{position:absolute;top:-12px;color:var(--snow-color);font-size:1rem;animation:snowfall linear infinite;opacity:0;will-change:transform;text-shadow:0 0 6px rgba(255,255,255,.35);user-select:none}
.snowflake.near{filter:blur(0);opacity:.95}
.snowflake.mid{filter:blur(.6px);opacity:.7}
.snowflake.far{filter:blur(1.4px);opacity:.45}
@keyframes snowfall{0%{transform:translateY(-12px) translateX(0) rotate(0deg);opacity:0}8%{opacity:var(--op,.9)}92%{opacity:var(--op,.9)}100%{transform:translateY(105vh) translateX(var(--drift)) rotate(360deg);opacity:0}}
@keyframes snowfall-gust{0%{transform:translateY(-12px) translateX(0) rotate(0deg);opacity:0}8%{opacity:var(--op,.9)}92%{opacity:var(--op,.9)}100%{transform:translateY(105vh) translateX(calc(var(--drift) * 2.2)) rotate(420deg);opacity:0}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;transition:background .3s,border-color .3s}
.nav-logo{display:flex;align-items:center}
.nav-logo img{width:38px;height:38px;object-fit:contain;display:block}
.nav-links{display:flex;gap:1.5rem;font-size:.9rem}
.nav-links a{color:var(--muted);font-weight:600}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:border-color .2s,background .2s;color:var(--text)}
.theme-toggle:hover{border-color:var(--accent);background:rgba(168,85,247,.08)}
.nav-cta{background:var(--accent);color:#fff;padding:.5rem 1.2rem;border-radius:8px;font-weight:700;font-size:.85rem;transition:transform .15s,box-shadow .15s}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
.burger{display:none;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}

/* MAIN CONTENT */
main{position:relative;z-index:1;flex:1}

/* FOOTER */
footer{text-align:center;padding:3rem 2rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);position:relative;z-index:1;transition:border-color .3s}

/* COMMON COMPONENTS */
.btn{display:inline-block;padding:.85rem 2rem;border-radius:10px;font-weight:700;font-size:1rem;transition:all .2s;cursor:pointer;border:none;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{box-shadow:0 4px 24px var(--accent-glow);transform:translateY(-2px)}
.btn-outline{border:2px solid var(--border);color:var(--text);background:transparent}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.section-title{font-size:2rem;font-weight:800;margin-bottom:2rem;display:flex;align-items:center;gap:.75rem}
.section-title::before{content:'';width:4px;height:2rem;background:var(--accent);border-radius:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;transition:border-color .2s,background .3s}
.card:hover{border-color:var(--accent)}

@media(max-width:768px){
  nav .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--nav-bg);flex-direction:column;padding:1rem 2rem;gap:.75rem;border-bottom:1px solid var(--border)}
  nav .nav-links.open{display:flex}
  .burger{display:block}
  .nav-cta{display:none}
}
</style>
<style>.account-link{color:var(--text);font-weight:700;font-size:.88rem;padding:.48rem .85rem;border:1px solid var(--border);border-radius:8px;white-space:nowrap}.account-link:hover{color:var(--accent);border-color:var(--accent)}@media(max-width:700px){.account-link{font-size:.8rem;padding:.4rem .6rem}}</style>
</head>

<main>
<style>
.apply-page{max-width:720px;margin:0 auto;padding:6rem 1.5rem 4rem}
.apply-header{text-align:center;margin-bottom:2.5rem}
.apply-header h1{font-size:2rem;font-weight:800;margin-bottom:.5rem}
.apply-header p{color:var(--muted);font-size:1rem}

.form-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:1.5rem;transition:background .3s,border-color .3s}
.form-section h2{font-size:1.25rem;font-weight:700;margin-bottom:1.5rem;color:var(--accent);display:flex;align-items:center;gap:.5rem}

.field{margin-bottom:1.2rem}
.field-label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.5rem;color:var(--text)}
.field input[type="text"],
.field input[type="number"],
.field textarea{width:100%;padding:.65rem .9rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:.95rem;font-family:inherit;transition:border-color .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}

/* Radio & Checkbox groups */
.option-group{display:flex;flex-wrap:wrap;gap:.5rem}
.option-item{display:flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);cursor:pointer;transition:all .2s;font-size:.9rem;user-select:none}
.option-item:hover{border-color:var(--accent)}
.option-item input{display:none}
.option-item input:checked + span{color:var(--accent);font-weight:700}
.option-item:has(input:checked){border-color:var(--accent);background:rgba(168,85,247,.08)}
.option-item span{pointer-events:none}

/* Checkbox cards for aspects */
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
.checkbox-card{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);cursor:pointer;transition:all .2s;font-size:.9rem;user-select:none}
.checkbox-card:hover{border-color:var(--accent)}
.checkbox-card input{display:none}
.checkbox-card:has(input:checked){border-color:var(--accent);background:rgba(168,85,247,.08)}
.checkbox-card:has(input:checked) span{color:var(--accent);font-weight:700}
.checkbox-card span{pointer-events:none}

/* Agreement checkboxes */
.agree-item{display:flex;align-items:flex-start;gap:.6rem;padding:.8rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);margin-bottom:.7rem;cursor:pointer;transition:all .2s}
.agree-item:hover{border-color:var(--accent)}
.agree-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.agree-item .agree-text{font-size:.9rem;line-height:1.4}
.agree-item .agree-hint{font-size:.8rem;color:var(--muted);margin-top:.2rem}

.btn-submit{width:100%;padding:1rem;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;margin-top:.5rem}
.btn-submit:hover{box-shadow:0 4px 20px var(--accent-glow);transform:translateY(-2px)}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}

.form-status{margin-top:1rem;text-align:left;font-size:.98rem;line-height:1.5;border-radius:10px;padding:1rem 1.1rem;display:none;scroll-margin-top:84px}
.form-status strong{display:block;font-size:1.05rem;margin-bottom:.25rem}
.form-status.success{display:block;background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.35)}
.form-status.error{display:block;background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.35)}

@media(max-width:600px){
  .apply-page{padding:5rem 1rem 3rem}
  .form-section{padding:1.3rem}

</style>

          <label class="option-item"><input type="radio" name="source" value="Discord"><span>💬 Discord</span></label>

    <div id="formStatus" class="form-status" role="status" aria-live="polite" tabindex="-1"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('applyForm');
  if (!form) {
    console.error('Форма applyForm не найдена');
    return;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    e.stopPropagation();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('formStatus');
    btn.disabled = true;
    btn.textContent = 'Отправка...';
    status.className = 'form-status';
    status.textContent = '';

    try {
      const aspects = Array.from(document.querySelectorAll('input[name="aspects"]:checked')).map(c => c.value).join(', ') || '—';
      const source = document.querySelector('input[name="source"]:checked')?.value || '—';
      const hours = document.querySelector('input[name="hours"]:checked')?.value || '—';
      const events = document.querySelector('input[name="events"]:checked')?.value || '—';
      const help = document.querySelector('input[name="help"]:checked')?.value || '—';

      const params = {
        nick: document.getElementById('nick').value,
        age: document.getElementById('age').value,
        source: source,
        contact: document.getElementById('contact').value,
        hours: hours,
        experience: document.getElementById('experience').value,
        vanilla_exp: document.getElementById('vanilla_exp').value || '—',
        aspects: aspects,
        plans: document.getElementById('plans').value,
        reason: document.getElementById('reason').value,
        events: events,
        conflicts: document.getElementById('conflicts').value,
        help: help,
        attitude: document.getElementById('attitude').value,
        no_cheats: document.getElementById('no_cheats').checked ? 'Да' : 'Нет',
        rules_agree: document.getElementById('rules_agree').checked ? 'Да' : 'Нет'
      };

      const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_id: 'service_mdy3gqa',
          template_id: 'template_i52qgrl',
          user_id: 'IpDZGs1n3Af92cMem',
          template_params: params
        })
      });

      if (res.ok) {
        status.className = 'form-status success';
        status.innerHTML = '<strong>✓ Заявка отправлена</strong>Анкета успешно доставлена. Мы свяжемся с тобой по указанному контакту.';
        btn.textContent = '✓ Заявка отправлена';
        status.focus();
        status.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        throw new Error('Не удалось подтвердить отправку');
      }
    } catch (err) {
      status.className = 'form-status error';
      status.innerHTML = '<strong>Не удалось подтвердить отправку</strong>Текст анкеты остался в форме. Проверь соединение и попробуй ещё раз или напиши нам в Discord.';
      status.focus();
      status.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } finally {
      if (status.classList.contains('error')) {
        btn.disabled = false;
        btn.textContent = 'Попробовать ещё раз';
      }
    }
  });
});
</script>

<script src="button-click.js?v=2"></script>
<script>
// Theme toggle
const html = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
const saved = localStorage.getItem('theme') || 'dark';
html.setAttribute('data-theme', saved);
themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';

themeBtn.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

// Mobile menu
document.getElementById('burgerBtn').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

// Snowflakes
const snowContainer = document.getElementById('snowContainer');
const symbols = ['❄','❅','❆','❄','✦','✧','❄','•'];
const rand = (a,b) => a + Math.random() * (b - a);
function createSnowflake() {
  const el = document.createElement('span');
  // depth layer: far = small/blurry/slow, near = big/sharp/fast
  const roll = Math.random();
  let layer, size, dur, op;
  if (roll < 0.45) { layer = 'far'; size = rand(0.35, 0.7); dur = rand(16, 26); op = rand(0.25, 0.45); }
  else if (roll < 0.8) { layer = 'mid'; size = rand(0.7, 1.2); dur = rand(10, 18); op = rand(0.5, 0.75); }
  else { layer = 'near'; size = rand(1.2, 2.1); dur = rand(6, 12); op = rand(0.8, 1); }
  el.className = 'snowflake ' + layer;
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = rand(-2, 100) + '%';
  el.style.fontSize = size + 'rem';
  el.style.setProperty('--drift', rand(-70, 70) + 'px');
  el.style.setProperty('--op', op);
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = rand(-20, 0) + 's';
  if (Math.random() < 0.18) {
    el.style.animationName = 'snowfall-gust';
    el.style.animationDuration = dur * 0.7 + 's';
  }
  snowContainer.appendChild(el);
  setTimeout(() => el.remove(), (dur + 25) * 1000);
}
// Initial batch — dense snow
for (let i = 0; i < 80; i++) createSnowflake();
// Continuous snowfall
setInterval(createSnowflake, 180);
// Gust waves
setInterval(() => {
  const all = snowContainer.querySelectorAll('.snowflake');
  all.forEach(el => {
    if (Math.random() < 0.12) {
      el.style.setProperty('--drift', rand(-120, 120) + 'px');
    }
  });
}, 2500);

// Active link highlight
const path = window.location.pathname;
document.querySelectorAll('.nav-links a').forEach(a => {
  a.classList.remove('active');
  if (a.getAttribute('href') === path) a.classList.add('active');
});
</script>
