<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — MaoPickMe</title><link rel="stylesheet" href="account.css"></head><body><main class="auth-wrap"><header class="brand"><a href="../index.html"><img src="../logo.png" alt="MaoPickMe"></a><h1>MaoPickMe</h1><p>Единый аккаунт экосистемы Mao</p></header><section class="auth-card"><h2>Создать аккаунт</h2><p class="sub">Одна учётная запись для сайта, лаунчера и сервера.</p><form id="registerForm"><label class="field"><span>Логин</span><input name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" required placeholder="MaoPlayer"></label><label class="field"><span>Email</span><input name="email" type="email" maxlength="254" autocomplete="email" required placeholder="name@example.com"></label><label class="field"><span>Отображаемое имя</span><input name="display_name" minlength="2" maxlength="32" required placeholder="Как вас будут видеть"></label><label class="field"><span>Пароль</span><input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required placeholder="Минимум 10 символов"></label><button class="primary" type="submit">Зарегистрироваться</button></form><div class="message" id="message" role="status"></div><p class="foot">Уже есть аккаунт? <a href="login.html">Войти</a></p></section><a class="back" href="../index.html">← Вернуться на сайт</a></main><script src="auth.js"></script></body></html>
