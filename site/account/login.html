<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — MaoPickMe</title><link rel="stylesheet" href="account.css"></head><body><main class="auth-wrap"><header class="brand"><a href="../index.html"><img src="../logo.png" alt="MaoPickMe"></a><h1>MaoPickMe</h1><p>Единый аккаунт экосистемы Mao</p></header><section class="auth-card"><h2>Вход в аккаунт</h2><p class="sub">Используйте логин или адрес электронной почты.</p><form id="loginForm"><label class="field"><span>Логин или Email</span><input name="identity" autocomplete="username" required placeholder="MaoPlayer или email"></label><label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required placeholder="Ваш пароль"></label><button class="primary" type="submit">Войти</button></form><div class="message" id="message" role="status"></div><p class="foot">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p></section><a class="back" href="../index.html">← Вернуться на сайт</a></main><script src="auth.js"></script><script>if(new URLSearchParams(location.search).has('verified')){const m=document.getElementById('message');m.textContent='Email подтверждён. Теперь можно войти.';m.classList.add('show')}</script></body></html>
